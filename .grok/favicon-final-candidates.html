<!doctype html>
<meta charset="utf-8">
<style>
  body{margin:0;font:12px/1.3 sans-serif}
  section{padding:16px 20px}
  .dark{background:#1b1511;color:#f3ebe0}
  .chrome{background:#dee1e6;color:#222}
  .row{display:flex;gap:28px;align-items:end;flex-wrap:wrap}
  .cell{text-align:center}
  svg{display:block}
  .s16{width:16px;height:16px}
  .s32{width:32px;height:32px}
  .tab{display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px 8px 0 0;padding:6px 12px 6px 8px;color:#222;margin-top:8px;width:max-content}
  label{display:block;margin:8px 0 4px;opacity:.75;font-size:11px}
</style>

<section class="dark">
  <label>DARK — 16 / 32 / tab</label>
  <div class="row">
    <div class="cell">
      <label>E2 square cap</label>
      <div class="row">
        <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
        <svg class="s32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
      </div>
      <div class="tab">
        <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
        Jeff's Radius
      </div>
    </div>
    <div class="cell">
      <label>E3 round cap</label>
      <div class="row">
        <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="round"/></svg>
        <svg class="s32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="round"/></svg>
      </div>
      <div class="tab">
        <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="round"/></svg>
        Jeff's Radius
      </div>
    </div>
    <div class="cell">
      <label>E4 + rail tail</label>
      <div class="row">
        <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9h4" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
        <svg class="s32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9h4" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
      </div>
      <div class="tab">
        <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9h4" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
        Jeff's Radius
      </div>
    </div>
    <div class="cell">
      <label>E5 optical center</label>
      <div class="row">
        <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M10 24V15.5A8.5 8.5 0 0 1 22 9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
        <svg class="s32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M10 24V15.5A8.5 8.5 0 0 1 22 9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
      </div>
      <div class="tab">
        <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M10 24V15.5A8.5 8.5 0 0 1 22 9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
        Jeff's Radius
      </div>
    </div>
  </div>
</section>
<section class="chrome">
  <label>CHROME TAB BAR</label>
  <div class="row">
    <div class="tab">
      <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
      Jeff's Radius Decks
    </div>
    <div class="tab">
      <svg class="s16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#F3EBE0"/><path d="M9 25V15a9 9 0 0 1 9-9h4" fill="none" stroke="#8F3A1E" stroke-width="5" stroke-linecap="square"/></svg>
      Jeff's Radius Decks
    </div>
  </div>
</section>
