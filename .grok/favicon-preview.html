<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#333;font:12px sans-serif;color:#eee}
  .row{display:flex;gap:24px;padding:16px;align-items:flex-end}
  .cell{text-align:center}
  img{image-rendering:pixelated;background:#fff;display:block}
  .s16{width:16px;height:16px}
  .s32{width:32px;height:32px}
  .s64{width:64px;height:64px}
  .s128{width:128px;height:128px;image-rendering:auto}
</style>
<div class="row">
  <div class="cell"><img class="s16" src="favicon.svg.tmp"><div>16</div></div>
  <div class="cell"><img class="s32" src="favicon.svg.tmp"><div>32</div></div>
  <div class="cell"><img class="s64" src="favicon.svg.tmp"><div>64</div></div>
  <div class="cell"><img class="s128" src="favicon.svg.tmp"><div>128</div></div>
</div>
